name: Build Nahid SDXL V3

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: SDXL Android ARM64 CPU + Adreno OpenCL
    runs-on: ubuntu-24.04

    steps:
      # ----------------------------------------------------------
      # 1. Checkout full history
      # ----------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # ----------------------------------------------------------
      # 2. Pin to lean snapshot:
      #    after Android OpenCL support existed,
      #    before Wan / Qwen / later model-family bloat
      # ----------------------------------------------------------
      - name: Checkout lean stable snapshot
        shell: bash
        run: |
          echo "Finding latest commit before 2025-09-01..."

          SNAPSHOT=$(git rev-list -1 \
            --before="2025-09-01 00:00:00 UTC" \
            HEAD)

          if [ -z "$SNAPSHOT" ]; then
            echo "ERROR: Snapshot commit not found"
            exit 1
          fi

          echo "Using snapshot:"
          echo "$SNAPSHOT"

          git checkout "$SNAPSHOT"

          git submodule sync --recursive
          git submodule update --init --recursive

          echo "NAHID_SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

          git log -1 \
            --format="Commit: %H%nDate: %ci%nSubject: %s"

      # ----------------------------------------------------------
      # 3. Android SDK + NDK r26c
      # ----------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          sdkmanager "ndk;26.2.11394342"

          echo \
            "NDK=$ANDROID_SDK_ROOT/ndk/26.2.11394342" \
            >> "$GITHUB_ENV"

      # ----------------------------------------------------------
      # 4. Small set of required build tools
      # ----------------------------------------------------------
      - name: Install build tools
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            git \
            file \
            binutils

      # ----------------------------------------------------------
      # 5. OpenCL headers
      # ----------------------------------------------------------
      - name: Install OpenCL headers
        shell: bash
        run: |
          git clone \
            --depth 1 \
            https://github.com/KhronosGroup/OpenCL-Headers.git \
            "$RUNNER_TEMP/OpenCL-Headers"

          cp -R \
            "$RUNNER_TEMP/OpenCL-Headers/CL" \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include/"

      # ----------------------------------------------------------
      # 6. OpenCL ICD loader
      #    BUILD-TIME ONLY.
      #    It will NOT be packaged in our final engine.
      # ----------------------------------------------------------
      - name: Build OpenCL link library
        shell: bash
        run: |
          git clone \
            --depth 1 \
            https://github.com/KhronosGroup/OpenCL-ICD-Loader.git \
            "$RUNNER_TEMP/OpenCL-ICD-Loader"

          cmake \
            -S "$RUNNER_TEMP/OpenCL-ICD-Loader" \
            -B "$RUNNER_TEMP/opencl-build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DOPENCL_ICD_LOADER_HEADERS_DIR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=24 \
            -DANDROID_STL=c++_shared \
            -DBUILD_TESTING=OFF

          cmake \
            --build "$RUNNER_TEMP/opencl-build" \
            -j 2

          cp \
            "$RUNNER_TEMP/opencl-build/libOpenCL.so" \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libOpenCL.so"

      # ----------------------------------------------------------
      # 7. Configure V3
      #
      # KEEP:
      #   ARM64
      #   CPU
      #   OpenCL
      #   Adreno kernels
      #   GGUF / Q4_K
      #   SD/SDXL runtime
      #
      # REMOVE:
      #   Vulkan
      #   CUDA
      #   Metal
      #   HIP
      #   SYCL
      #   MUSA
      #   RPC
      #   OpenMP
      #   BLAS
      #   WebP/WebM
      #   examples
      # ----------------------------------------------------------
      - name: Configure Nahid V3
        shell: bash
        run: |
          cmake \
            -S . \
            -B build-v3 \
            -G Ninja \
            \
            -DCMAKE_BUILD_TYPE=MinSizeRel \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_shared \
            \
            -DSD_BUILD_SHARED_LIBS=ON \
            -DSD_BUILD_SHARED_GGML_LIB=OFF \
            -DSD_BUILD_EXAMPLES=OFF \
            \
            -DSD_OPENCL=ON \
            -DSD_VULKAN=OFF \
            -DSD_CUDA=OFF \
            -DSD_METAL=OFF \
            -DSD_HIPBLAS=OFF \
            -DSD_SYCL=OFF \
            -DSD_MUSA=OFF \
            -DSD_RPC=OFF \
            \
            -DSD_WEBP=OFF \
            -DSD_WEBM=OFF \
            \
            -DGGML_OPENMP=OFF \
            -DGGML_BLAS=OFF \
            -DGGML_NATIVE=OFF \
            -DGGML_RPC=OFF \
            \
            -DGGML_OPENCL=ON \
            -DGGML_OPENCL_USE_ADRENO_KERNELS=ON \
            -DGGML_OPENCL_PROFILING=OFF \
            \
            -DCMAKE_C_FLAGS_MINSIZEREL="-Os -DNDEBUG -ffunction-sections -fdata-sections" \
            -DCMAKE_CXX_FLAGS_MINSIZEREL="-Os -DNDEBUG -ffunction-sections -fdata-sections" \
            -DCMAKE_SHARED_LINKER_FLAGS="-Wl,--gc-sections"

      # ----------------------------------------------------------
      # 8. Build only shared engine
      # ----------------------------------------------------------
      - name: Build V3 engine
        shell: bash
        run: |
          cmake \
            --build build-v3 \
            --target stable-diffusion \
            -j 2

      # ----------------------------------------------------------
      # 9. Locate + strip
      # ----------------------------------------------------------
      - name: Prepare final engine
        shell: bash
        run: |
          mkdir -p output/arm64-v8a
          mkdir -p output/audit

          ENGINE=$(
            find build-v3 \
              -type f \
              -name "libstable-diffusion.so" \
              | head -n 1
          )

          if [ -z "$ENGINE" ]; then
            echo "ERROR: libstable-diffusion.so not found"
            exit 1
          fi

          echo "Engine:"
          echo "$ENGINE"

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip" \
            --strip-unneeded \
            "$ENGINE"

          cp \
            "$ENGINE" \
            output/arm64-v8a/libstable-diffusion.so

          cp \
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
            output/arm64-v8a/libc++_shared.so

      # ----------------------------------------------------------
      # 10. Binary audit
      # ----------------------------------------------------------
      - name: Audit binary
        shell: bash
        run: |
          ENGINE="output/arm64-v8a/libstable-diffusion.so"
          READELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          {
            echo "====================================="
            echo "NAHID SDXL ENGINE V3"
            echo "====================================="
            echo
            echo "Snapshot:"
            echo "$NAHID_SNAPSHOT"
            echo

            echo "FILE:"
            file "$ENGINE"
            echo

            echo "FILES:"
            ls -lh output/arm64-v8a/
            echo

            echo "DEPENDENCIES:"
            "$READELF" -d "$ENGINE" | grep NEEDED || true
            echo

            echo "ELF SECTIONS:"
            "$READELF" -S "$ENGINE" || true
            echo

            echo "SHA256:"
            sha256sum "$ENGINE"

          } | tee output/audit/report.txt

      # ----------------------------------------------------------
      # 11. Make sure forbidden backends didn't sneak in
      # ----------------------------------------------------------
      - name: Reject unwanted runtime dependencies
        shell: bash
        run: |
          ENGINE="output/arm64-v8a/libstable-diffusion.so"

          DEPS=$(
            "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
              -d "$ENGINE" \
            | grep NEEDED || true
          )

          echo "$DEPS"

          if echo "$DEPS" | grep -Eqi \
            "vulkan|cuda|cudart|cublas|hip|metal|sycl|libomp|openmp|blas"; then

            echo "ERROR:"
            echo "Unwanted backend dependency found."
            exit 1
          fi

          echo "Backend dependency audit PASSED."

      # ----------------------------------------------------------
      # 12. Check that late model families are NOT present
      # ----------------------------------------------------------
      - name: Audit unwanted modern model families
        shell: bash
        run: |
          ENGINE="output/arm64-v8a/libstable-diffusion.so"

          strings "$ENGINE" > output/audit/strings.txt

          echo "=== Unwanted late-family checks ===" \
            | tee output/audit/model-family-audit.txt

          for TERM in \
            "Qwen Image" \
            "Wan 2." \
            "Z-Image" \
            "Ideogram 4" \
            "Krea2" \
            "LingBot Video" \
            "LTXAV"
          do
            COUNT=$(
              grep -F -c "$TERM" \
                output/audit/strings.txt \
                || true
            )

            echo "$TERM = $COUNT" \
              | tee -a output/audit/model-family-audit.txt
          done

      # ----------------------------------------------------------
      # 13. Verify required capabilities
      # ----------------------------------------------------------
      - name: Verify SDXL and Q4_K capability
        shell: bash
        run: |
          ENGINE="output/arm64-v8a/libstable-diffusion.so"

          strings "$ENGINE" > "$RUNNER_TEMP/engine-strings.txt"

          echo "Checking SDXL..."

          if ! grep -qi "SDXL" "$RUNNER_TEMP/engine-strings.txt"; then
            echo "ERROR: SDXL support marker missing"
            exit 1
          fi

          echo "Checking Q4_K..."

          if ! grep -q "q4_K" "$RUNNER_TEMP/engine-strings.txt"; then
            echo "ERROR: Q4_K support marker missing"
            exit 1
          fi

          echo "SDXL marker present."
          echo "Q4_K marker present."

      # ----------------------------------------------------------
      # 14. Final output information
      # ----------------------------------------------------------
      - name: Final package report
        shell: bash
        run: |
          echo "====================================="
          echo "FINAL V3 PACKAGE"
          echo "====================================="

          find output \
            -maxdepth 3 \
            -type f \
            -print

          echo
          echo "ENGINE SIZE:"

          du -h \
            output/arm64-v8a/libstable-diffusion.so

          echo
          echo "TOTAL PACKAGE:"

          du -sh output

      # ----------------------------------------------------------
      # 15. Upload artifact
      # ----------------------------------------------------------
      - name: Upload Nahid SDXL V3
        uses: actions/upload-artifact@v4
        with:
          name: nahid-sdxl-v3-arm64
          path: output/
          compression-level: 9
          if-no-files-found: error
